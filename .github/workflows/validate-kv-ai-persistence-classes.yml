name: Validate KV AI Persistence Classes

on:
  push:
    paths:
      - "schemas/kv-ai-persistence-classes.schema.json"
      - "specs/kv-ai-persistence-classes.v1.json"
      - "scripts/validate_kv_ai_persistence_classes.py"
      - "tests/test_kv_ai_persistence_classes.py"
      - "schemas/kv-ai-persistence-layouts.schema.json"
      - "specs/kv-ai-persistence-layouts.v1.json"
      - "scripts/validate_kv_ai_persistence_layouts.py"
      - "tests/test_kv_ai_persistence_layouts.py"
      - "schemas/kv-cross-class-intr-transition.schema.json"
      - "specs/kv-cross-class-intr-transition.example.v1.json"
      - "specs/kv-cross-class-intr-transition-fixtures.v1.json"
      - "scripts/validate_kv_cross_class_intr_transition.py"
      - "scripts/validate_kv_cross_class_intr_fixtures.py"
      - "tests/test_kv_cross_class_intr_fixtures.py"
      - "runtime/machine_kv_reconstruction.py"
      - "tests/test_machine_kv_reconstruction.py"
      - "schemas/kv-ai-memory-context-request.schema.json"
      - "schemas/kv-ai-memory-context-packet.schema.json"
      - "schemas/kv-ai-memory-write-proposal.schema.json"
      - "specs/kv-ai-memory-substrate.v1.json"
      - "runtime/kv_ai_memory_substrate.py"
      - "runtime/kv_ai_memory_writeback_store.py"
      - "scripts/validate_kv_ai_memory_substrate.py"
      - "scripts/stage_kv_ai_memory_resident_inputs.py"
      - "tests/test_kv_ai_memory_substrate.py"
      - "tests/test_stage_kv_ai_memory_resident_inputs.py"
      - "tests/test_kv_ai_memory_writeback_store.py"
      - "KV_AI_PERSISTENCE_CLASSES_MIRROR_HANDOFF.md"
      - "README.md"
      - ".github/workflows/validate-kv-ai-persistence-classes.yml"
  pull_request:
    paths:
      - "schemas/kv-ai-persistence-classes.schema.json"
      - "specs/kv-ai-persistence-classes.v1.json"
      - "scripts/validate_kv_ai_persistence_classes.py"
      - "tests/test_kv_ai_persistence_classes.py"
      - "schemas/kv-ai-persistence-layouts.schema.json"
      - "specs/kv-ai-persistence-layouts.v1.json"
      - "scripts/validate_kv_ai_persistence_layouts.py"
      - "tests/test_kv_ai_persistence_layouts.py"
      - "schemas/kv-cross-class-intr-transition.schema.json"
      - "specs/kv-cross-class-intr-transition.example.v1.json"
      - "specs/kv-cross-class-intr-transition-fixtures.v1.json"
      - "scripts/validate_kv_cross_class_intr_transition.py"
      - "scripts/validate_kv_cross_class_intr_fixtures.py"
      - "tests/test_kv_cross_class_intr_fixtures.py"
      - "runtime/machine_kv_reconstruction.py"
      - "tests/test_machine_kv_reconstruction.py"
      - "schemas/kv-ai-memory-context-request.schema.json"
      - "schemas/kv-ai-memory-context-packet.schema.json"
      - "schemas/kv-ai-memory-write-proposal.schema.json"
      - "specs/kv-ai-memory-substrate.v1.json"
      - "runtime/kv_ai_memory_substrate.py"
      - "runtime/kv_ai_memory_writeback_store.py"
      - "scripts/validate_kv_ai_memory_substrate.py"
      - "scripts/stage_kv_ai_memory_resident_inputs.py"
      - "tests/test_kv_ai_memory_substrate.py"
      - "tests/test_stage_kv_ai_memory_resident_inputs.py"
      - "tests/test_kv_ai_memory_writeback_store.py"
      - "KV_AI_PERSISTENCE_CLASSES_MIRROR_HANDOFF.md"
      - "README.md"
      - ".github/workflows/validate-kv-ai-persistence-classes.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/validate_kv_ai_persistence_classes.py
      - run: python tests/test_kv_ai_persistence_classes.py
      - run: python scripts/validate_kv_ai_persistence_layouts.py
      - run: python -m pytest -q tests/test_kv_ai_persistence_layouts.py
      - run: python scripts/validate_kv_cross_class_intr_transition.py
      - run: python scripts/validate_kv_cross_class_intr_fixtures.py
      - run: python -m pytest -q tests/test_kv_cross_class_intr_fixtures.py
      - run: python -m pytest -q tests/test_machine_kv_reconstruction.py
      - run: python scripts/validate_kv_ai_memory_substrate.py
      - run: python tests/test_kv_ai_memory_substrate.py
      - run: python -m pytest -q tests/test_stage_kv_ai_memory_resident_inputs.py
      - run: python -m pytest -q tests/test_kv_ai_memory_writeback_store.py
