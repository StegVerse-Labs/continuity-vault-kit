name: Endpoint Fanout Probe Validation

on:
  pull_request:
    paths:
      - "tools/run_endpoint_fanout_probe.py"
      - "tests/test_endpoint_fanout_probe.py"
      - ".github/workflows/validate-endpoint-fanout-probe.yml"
      - "KV_INTERLOCK_RUNTIME_ENDPOINT_MIRROR_HANDOFF.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile probe
        run: python -m py_compile tools/run_endpoint_fanout_probe.py tests/test_endpoint_fanout_probe.py
      - name: Run endpoint fanout probe tests
        run: python -m unittest -v tests.test_endpoint_fanout_probe
      - name: Emit deterministic probe evidence
        run: |
          mkdir -p probe-evidence
          python tools/run_endpoint_fanout_probe.py \
            --value "stegverse-endpoint-fanout-probe" \
            --probe-id "ci-endpoint-fanout-001" \
            --output probe-evidence/endpoint-fanout-probe.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-fanout-probe-evidence
          path: probe-evidence/endpoint-fanout-probe.result.json
          if-no-files-found: error
