name: KV Guardrails (Layer + Footer)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  kv-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Layer Boundary Check
        run: |
          python3 tools/kv_layer_check.py

      - name: Run Footer Check
        run: |
          python3 tools/kv_footer.py check
