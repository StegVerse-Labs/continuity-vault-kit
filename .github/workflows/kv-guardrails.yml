name: KV Guardrails (Layer + Footer + Emoji + InTr)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kv-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Compile guardrail tools
        run: |
          python3 -m py_compile \
            tools/kv_layer_check.py \
            tools/emoji_lint.py \
            scripts/validate_skap_intr_review_candidate.py \
            scripts/validate_intr_packet_review_candidate.py \
            scripts/intr_hop_receipt.py \
            scripts/validate_skap_endpoint_contracts.py \
            execution/vault_store.py \
            tests/test_vault_store.py \
            tests/test_skap_intr_reconstruction.py

      - name: KV layer boundary + footer validation
        run: python3 tools/kv_layer_check.py --mode validate

      - name: Emoji + glyph lint
        run: python3 tools/emoji_lint.py --strict

      - name: Validate SKAP InTr schemas and receipt chains
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          pairs = [
              ('schemas/skap-intr-review-candidate.schema.json', 'specs/skap-intr-review-candidate.v1.json'),
              ('schemas/intr-packet-review-candidate.schema.json', 'specs/intr-packet-review-candidate.v1.json'),
          ]
          for schema_path, value_path in pairs:
              schema=json.loads(Path(schema_path).read_text(encoding='utf-8'))
              value=json.loads(Path(value_path).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator(schema).validate(value)
              print('SCHEMA_PASS', value_path)

          for schema_path in (
              'schemas/skap-sealed-object.schema.json',
              'schemas/skap-lifecycle-transition-receipt.schema.json',
              'schemas/intr-endpoint-session-proof.schema.json',
              'schemas/intr-hop-receipt.schema.json',
          ):
              schema=json.loads(Path(schema_path).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator.check_schema(schema)
              print('SCHEMA_DEFINITION_PASS', schema_path)

          receipt_schema=json.loads(Path('schemas/intr-hop-receipt.schema.json').read_text(encoding='utf-8'))
          validator=jsonschema.Draft202012Validator(receipt_schema)
          for chain_path in (
              'examples/intr-hop-receipt-chain.example.json',
              'examples/intr-hop-return-receipt-chain.example.json',
          ):
              chain=json.loads(Path(chain_path).read_text(encoding='utf-8'))
              for receipt in chain:
                  validator.validate(receipt)
              print('SCHEMA_PASS', chain_path)
          PY

      - name: Validate SKAP InTr semantic boundaries
        run: |
          python3 scripts/validate_skap_intr_review_candidate.py specs/skap-intr-review-candidate.v1.json --self-test
          python3 scripts/validate_intr_packet_review_candidate.py specs/intr-packet-review-candidate.v1.json --self-test
          python3 scripts/validate_skap_endpoint_contracts.py --self-test
          python3 scripts/intr_hop_receipt.py verify-chain examples/intr-hop-receipt-chain.example.json
          python3 scripts/intr_hop_receipt.py verify-chain examples/intr-hop-return-receipt-chain.example.json

      - name: Validate KV InTr persistence boundary
        run: python3 -m unittest tests.test_vault_store -v

      - name: Reconstruct synthetic SKAP InTr round trip
        run: python3 -m unittest tests.test_skap_intr_reconstruction -v

      - name: Prove hosted validation is non-authorizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/kv-guardrails.yml').read_text(encoding='utf-8')
          assert 'contents: read' in text
          assert 'contents: write' not in text
          assert 'git push' not in text
          assert 'secrets.' not in text
          print('KV_INTR_HOSTED_VALIDATION_NON_AUTHORIZING_PASS')
          PY

      - name: Guardrail repair guidance
        if: failure()
        run: |
          echo ""
          echo "KV guardrails failed."
          echo "Layer/footer repair path: push a format/<name> branch so KV Format Branch can auto-label Markdown files."
          echo "Emoji repair path: replace obscure arrow glyphs with canonical relationship emoji or ASCII arrows."
          echo "InTr repair path: preserve canonical adjacency, sealed transit, non-transfer of authority, endpoint-session gating, lifecycle transition integrity, bidirectional receipt-chain integrity, KV metadata-only persistence, and complete reconstruction evidence."
          echo "No workflow may move, delete, or inspect user-authored personal vault content."
          echo ""
