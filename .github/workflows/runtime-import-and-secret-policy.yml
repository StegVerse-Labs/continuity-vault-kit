name: Runtime Import + Secret Field Policy

# Deliberately unfiltered by path.
#
# Every other workflow here filters on an explicit file list. That is why
# runtime/portable_direct_source_ingress.py sat on main carrying a raw NUL
# byte and two `"\"` literals that ended their own string, and why
# runtime/portable_directory_projection.py carried the same backslash defect:
# no workflow named either file, so nothing ever imported them. A guard whose
# job is to catch unreferenced breakage must not itself be path-scoped.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema cryptography

      # Cheapest possible gate, and the one that was missing: every runtime
      # and skap module must at least compile.
      - name: Compile every runtime and skap module
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for d in ("runtime", "skap"):
              for p in sorted(pathlib.Path(d).rglob("*.py")):
                  try:
                      compile(p.read_bytes(), str(p), "exec")
                  except (SyntaxError, ValueError) as exc:
                      bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all modules compile")
          PY

      - name: Secret field policy
        run: python -m pytest -q tests/test_secret_field_policy.py

      - name: Boundary modules that consume the policy
        run: |
          python -m pytest -q \
            tests/test_kv_skap_account_transfer.py \
            tests/test_kv_interlock_runtime_endpoint.py \
            tests/test_kv_ladder_conformance_lc_kv.py \
            tests/test_kv_gateway_storage.py \
            tests/test_persistent_session_interlock.py \
            tests/test_portable_direct_source_ingress.py \
            tests/test_portable_directory_projection.py \
            tests/test_intr_lifecycle_closure.py

      # Site#1509: the Personal KV Workspace projection (consumed by the .github
      # DEVICE_KV receiver and Site WorkSpace) had no workflow running its tests.
      - name: Workspace projection contract
        run: python -m pytest -q tests/test_workspace_projection.py tests/test_workspace_continuity_checkpoint.py tests/test_workspace_assistant_binding.py tests/test_workspace_session_authentication.py tests/test_workspace_tasks_projection.py tests/test_workspace_family_projections.py tests/test_workspace_continuity_checkpoint_projection.py tests/test_workspace_decision_reasons.py

      # KV-SKAP-VAULT-FUNCTIONAL-001 (StegVerse-Labs/.github#3324): finish-point acceptance test.
      # Stdlib unittest so it reaches its verdict at E0. Predicates without evidence are six-field
      # FAIL_CLOSED inside the verdict; the ledger append is exercised in scratch only; no test is skipped.
      - name: KV/SKAP Vault finish point (E0)
        run: |
          set -o pipefail
          python -m unittest -v tests.test_kv_skap_vault_finish_point 2>&1 | tee /tmp/finish.txt
          ! grep -Eq "skipped=[0-9]+|\.\.\. skipped" /tmp/finish.txt

      # LC-KV-04: the E0 witnesses end to end (lineage, ecosystem git-ref custody, validator disposition,
      # evidence-driven finish point ALLOW, scratch organization-ledger receipt).
      - name: KV/SKAP Vault E0 witnesses
        run: |
          set -o pipefail
          python -m unittest -v tests.test_kv_skap_vault_e0_witnesses 2>&1 | tee /tmp/witness.txt
          ! grep -Eq "skipped=[0-9]+|\.\.\. skipped" /tmp/witness.txt
