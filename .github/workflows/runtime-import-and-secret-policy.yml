name: Runtime Import + Secret Field Policy

# Deliberately unfiltered by path.
#
# Every other workflow here filters on an explicit file list. That is why
# runtime/portable_direct_source_ingress.py sat on main carrying a raw NUL
# byte and two `"\"` literals that ended their own string, and why
# runtime/portable_directory_projection.py carried the same backslash defect:
# no workflow named either file, so nothing ever imported them. A guard whose
# job is to catch unreferenced breakage must not itself be path-scoped.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema cryptography

      # Cheapest possible gate, and the one that was missing: every runtime
      # and skap module must at least compile.
      - name: Compile every runtime and skap module
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for d in ("runtime", "skap"):
              for p in sorted(pathlib.Path(d).rglob("*.py")):
                  try:
                      compile(p.read_bytes(), str(p), "exec")
                  except (SyntaxError, ValueError) as exc:
                      bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all modules compile")
          PY

      - name: Secret field policy
        run: python -m pytest -q tests/test_secret_field_policy.py

      - name: Boundary modules that consume the policy
        run: |
          python -m pytest -q \
            tests/test_kv_skap_account_transfer.py \
            tests/test_kv_interlock_runtime_endpoint.py \
            tests/test_persistent_session_interlock.py \
            tests/test_portable_direct_source_ingress.py \
            tests/test_portable_directory_projection.py \
            tests/test_intr_lifecycle_closure.py

      # Site#1509: the Personal KV Workspace projection (consumed by the .github
      # DEVICE_KV receiver and Site WorkSpace) had no workflow running its tests.
      - name: Workspace projection contract
        run: python -m pytest -q tests/test_workspace_projection.py tests/test_workspace_continuity_checkpoint.py tests/test_workspace_assistant_binding.py tests/test_workspace_session_authentication.py tests/test_workspace_tasks_projection.py tests/test_workspace_family_projections.py tests/test_workspace_continuity_checkpoint_projection.py tests/test_workspace_decision_reasons.py

      # KV-SKAP-VAULT-FUNCTIONAL-001 (StegVerse-Labs/.github#3324): finish-point acceptance test.
      # Stdlib unittest so it reaches its verdict at E0. Predicates without evidence are six-field
      # FAIL_CLOSED inside the verdict; the ledger append is exercised in scratch only; no test is skipped.
      - name: Finish-point verdict paths, NOT_SELECTED and SELECTED (unittest, no skips)
        run: |
          set -o pipefail
          python -m unittest -v tests.test_finish_point_verdict 2>&1 | tee /tmp/finish-point-verdict.log
          if grep -Eq 'skipped|expected failure' /tmp/finish-point-verdict.log; then
            echo "::error::a finish-point verdict test was skipped; skips are never accepted"; exit 1
          fi
      - name: Callable test set - is the finish point selected by this change (pinned StegVerse-Labs selector)
        id: select
        # StegVerse-org/.github#166. The selector is StegVerse-Labs scripts/test_set_selection.py, reused (not forked):
        # fetched anonymously at the commit in .stegverse/labs-tool-pin.json and run only after its sha256 matches.
        # .stegverse/finish_point_verdict.py turns its sealed record into a sealed verdict. NOT_SELECTED only when the
        # record is a sealed DIFF selection with the diff available and the finish set (spec finish_point_set) not
        # selected; an unmapped or selection-shaping path, an unreadable diff, a stale manifest, a selector that was
        # not fetched or does not match its pin, a push, or any error is SELECTED. This step never fails and no step
        # here has an if: the finish step always runs and either receipts NOT_SELECTED or runs the test.
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          LABS="$RUNNER_TEMP/labs-tool"
          selector=""
          if [ "$EVENT" = pull_request ]; then
            pin=.stegverse/labs-tool-pin.json
            if python3 - "$pin" "$LABS" <<'PY'
          import hashlib, json, os, subprocess, sys
          pin, dest = json.load(open(sys.argv[1])), sys.argv[2]
          env = {**os.environ, "GIT_TERMINAL_PROMPT": "0"}
          git = lambda *a: subprocess.run(["git", "-C", dest, *a], check=True, env=env, capture_output=True, text=True)
          subprocess.run(["git", "init", "-q", dest], check=True, env=env)
          git("-c", "http.https://github.com/.extraheader=", "fetch", "--no-tags", "--quiet", "--depth=1", pin["url"], pin["commit"])
          git("checkout", "-q", "FETCH_HEAD")
          assert git("rev-parse", "HEAD").stdout.strip() == pin["commit"], "fetched commit is not the pinned commit"
          for path, want in sorted(pin["files"].items()):
              got = hashlib.sha256(open(os.path.join(dest, path), "rb").read()).hexdigest()
              print(path, got)
              assert got == want, f"{path}: sha256 {got} is not the pinned {want}"
          PY
            then
              selector="$LABS/scripts/test_set_selection.py"
              python3 "$selector" select --root . \
                --manifest .stegverse/test-sets.json --spec .stegverse/test-set-spec.json \
                --base HEAD^1 --head HEAD --pr-head "$PR_HEAD" \
                --retry-entrypoint "Runtime Import + Secret Field Policy / guard" \
                --out "$RUNNER_TEMP/selection.json" || echo "::warning::selection is FAIL_CLOSED (see the record); the verdict decides"
            else
              echo "::warning::PINNED_LABS_TOOL_UNAVAILABLE: the pinned selector could not be fetched or verified; the finish point runs"
            fi
          fi
          out=$(python3 .stegverse/finish_point_verdict.py decide --event "$EVENT" \
            --spec .stegverse/test-set-spec.json --selection "$RUNNER_TEMP/selection.json" \
            --selector "$selector" --head "$(git rev-parse HEAD)" --pr-head "$PR_HEAD" \
            --out "$RUNNER_TEMP/finish-point-verdict.json")
          if [ "$out" = run=false ]; then run=false; else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "FINISH_POINT_SET verdict run=$run (event $EVENT); record finish-point-verdict.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: KV/SKAP Vault finish point (E0)
        env:
          RUN: ${{ steps.select.outputs.run }}
        run: |
          set -o pipefail
          if [ "$RUN" = false ] && python3 .stegverse/finish_point_verdict.py not-selected "$RUNNER_TEMP/finish-point-verdict.json" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "FINISH_POINT_SET NOT_SELECTED: the sealed verdict above shows no path of this change is in the set's closure; the step passes on it"
            exit 0
          fi
          python -m unittest -v tests.test_kv_skap_vault_finish_point 2>&1 | tee /tmp/finish.txt
          ! grep -Eq "skipped=[0-9]+|\.\.\. skipped" /tmp/finish.txt

      # LC-KV-04: the E0 witnesses end to end (lineage, ecosystem git-ref custody, validator disposition,
      # evidence-driven finish point ALLOW, scratch organization-ledger receipt).
      - name: KV/SKAP Vault E0 witnesses
        run: |
          set -o pipefail
          python -m unittest -v tests.test_kv_skap_vault_e0_witnesses 2>&1 | tee /tmp/witness.txt
          ! grep -Eq "skipped=[0-9]+|\.\.\. skipped" /tmp/witness.txt
