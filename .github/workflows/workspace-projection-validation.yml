name: Personal KV Workspace Projection Validation
on:
  push:
    paths:
      - 'runtime/workspace_projection.py'
      - 'tests/test_workspace_projection.py'
      - '.github/workflows/workspace-projection-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile runtime/workspace_projection.py tests/test_workspace_projection.py
      - name: Empty KV and AI-label checks
        run: |
          python - <<'PY'
          import tempfile,json
          from pathlib import Path
          from runtime.workspace_projection import get_personal_workspace_projection
          with tempfile.TemporaryDirectory() as d:
            root=Path(d)/'KnowledgeVault';(root/'_System').mkdir(parents=True)
            p=get_personal_workspace_projection(kv_data_root=root);assert p['state']=='KV_WORKSPACE_EMPTY'
            w=root/'_System'/'Workspace';w.mkdir()
            (w/'principals.json').write_text(json.dumps({'schema':'stegverse.kv.workspace-principals/v1','authority_effect':'NONE','principals':[{'principal_id':'ai:1','principal_type':'AI_ENTITY','display_name':'Agent'}]}))
            p=get_personal_workspace_projection(kv_data_root=root);assert p['principals'][0]['ai_label_required'] is True
          print('PERSONAL_KV_WORKSPACE_VALIDATION_PASS')
          PY
