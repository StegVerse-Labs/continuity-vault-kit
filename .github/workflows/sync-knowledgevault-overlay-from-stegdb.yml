name: Sync KnowledgeVault overlay from StegDB - Validation Only

on:
  workflow_dispatch:
    inputs:
      stegdb_ref:
        description: "StegDB ref (tag/branch/SHA) to evaluate when an admitted source materialization exists."
        required: false
        default: "main"
  schedule:
    - cron: "11 3 * * *"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout continuity-vault-kit without credential persistence
        uses: actions/checkout@v4
        with:
          path: _cvk
          persist-credentials: false

      - name: Record blocked private StegDB source transport
        shell: bash
        run: |
          set -euo pipefail
          REPORT="_cvk/reports/stegdb_overlay_sync"
          mkdir -p "$REPORT"
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema": "stegverse.kv.stegdb-overlay-sync-source-transport/v1",
              "state": "BLOCKED_PRIVATE_CROSS_REPO_SOURCE_TRANSPORT",
              "source_repository": "StegVerse-Labs/StegDB",
              "requested_stegdb_ref": "${{ inputs.stegdb_ref || 'main' }}",
              "target": "vault_template/KnowledgeVault/_Canon",
              "source_materialization_observed": False,
              "candidate_generation_attempted": False,
              "repository_mutation_performed": False,
              "stegdb_mutation_performed": False,
              "git_commit_performed": False,
              "git_push_performed": False,
              "github_actions_role": "VALIDATION_TRANSPORT_ONLY",
              "non_tv_tvc_cross_repo_credential_used": False,
              "canonical_next_transition": "AWAIT_ADMITTED_STEGDB_SOURCE_MATERIALIZATION",
              "authority_effect": "NONE",
              "observed_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          path = Path("_cvk/reports/stegdb_overlay_sync/source-transport-blocked.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload non-authorizing blocked-source observation
        uses: actions/upload-artifact@v4
        with:
          name: stegdb-overlay-sync-vault_template-KnowledgeVault-_Canon-blocked-${{ github.run_id }}
          path: _cvk/reports/stegdb_overlay_sync/source-transport-blocked.json
          if-no-files-found: error
          retention-days: 30
