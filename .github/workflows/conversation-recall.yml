name: Conversation Recall Validation

on:
  pull_request:
    paths:
      - "schemas/conversation-event.schema.json"
      - "continuity/**"
      - "tests/test_conversation_recall.py"
      - ".github/workflows/conversation-recall.yml"
      - "docs/CONVERSATION_CONTINUITY.md"
  push:
    branches: ["main"]
    paths:
      - "schemas/conversation-event.schema.json"
      - "continuity/**"
      - "tests/test_conversation_recall.py"
      - ".github/workflows/conversation-recall.yml"
      - "docs/CONVERSATION_CONTINUITY.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile recall surface
        run: python -m py_compile continuity/recall.py tests/test_conversation_recall.py
      - name: Run recall tests
        run: python -m unittest tests.test_conversation_recall -v
