name: Validate KV Interlock Contract

on:
  push:
    branches: ["main"]
    paths:
      - "schemas/kv-interlock-request.schema.json"
      - "schemas/kv-interlock-response.schema.json"
      - "schemas/kv-interlock-intr-envelope.schema.json"
      - "specs/kv-interlock-intr-envelope.v1.json"
      - "docs/KNOWLEDGEVAULT_INTERLOCK_PROTOCOL.md"
      - "tools/validate_kv_interlock_contract.py"
      - "tools/validate_kv_interlock_intr_envelope.py"
      - "runtime/kv_interlock_endpoint.py"
      - "tests/test_kv_interlock_runtime_endpoint.py"
      - "tools/run_endpoint_fanout_probe.py"
      - "tests/test_endpoint_fanout_probe.py"
      - "KV_INTERLOCK_RUNTIME_ENDPOINT_MIRROR_HANDOFF.md"
      - "tests/test_kv_interlock_contract.py"
      - "tests/test_kv_interlock_intr_envelope.py"
      - "KNOWLEDGEVAULT_MODULE_INTEGRATIONS_MIRROR_HANDOFF.md"
      - ".github/workflows/validate-kv-interlock-contract.yml"
  pull_request:
    paths:
      - "schemas/kv-interlock-request.schema.json"
      - "schemas/kv-interlock-response.schema.json"
      - "schemas/kv-interlock-intr-envelope.schema.json"
      - "specs/kv-interlock-intr-envelope.v1.json"
      - "docs/KNOWLEDGEVAULT_INTERLOCK_PROTOCOL.md"
      - "tools/validate_kv_interlock_contract.py"
      - "tools/validate_kv_interlock_intr_envelope.py"
      - "runtime/kv_interlock_endpoint.py"
      - "tests/test_kv_interlock_runtime_endpoint.py"
      - "KV_INTERLOCK_RUNTIME_ENDPOINT_MIRROR_HANDOFF.md"
      - "tests/test_kv_interlock_contract.py"
      - "tests/test_kv_interlock_intr_envelope.py"
      - "KNOWLEDGEVAULT_MODULE_INTEGRATIONS_MIRROR_HANDOFF.md"
      - ".github/workflows/validate-kv-interlock-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile canonical contract tooling
        run: |
          python -m py_compile tools/validate_kv_interlock_contract.py
          python -m py_compile tools/validate_kv_interlock_intr_envelope.py
          python -m py_compile runtime/kv_interlock_endpoint.py
          python -m py_compile tests/test_kv_interlock_runtime_endpoint.py
          python -m py_compile tools/run_endpoint_fanout_probe.py
          python -m py_compile tests/test_endpoint_fanout_probe.py
          python -m py_compile tests/test_kv_interlock_contract.py
          python -m py_compile tests/test_kv_interlock_intr_envelope.py
      - name: Validate canonical contract
        run: python tools/validate_kv_interlock_contract.py
      - name: Run canonical contract tests
        run: python -m unittest discover -s tests -p 'test_kv_interlock_contract.py' -v
      - name: Validate generic KV Interlock InTr envelope
        run: python tools/validate_kv_interlock_intr_envelope.py
      - name: Run generic KV Interlock InTr envelope tests
        run: python -m unittest discover -s tests -p 'test_kv_interlock_intr_envelope.py' -v
      - name: Run KV Interlock runtime endpoint tests
        run: python -m unittest discover -s tests -p 'test_kv_interlock_runtime_endpoint.py' -v
      - name: Run endpoint fanout probe tests
        run: python -m unittest discover -s tests -p 'test_endpoint_fanout_probe.py' -v
      - name: Emit endpoint fanout probe evidence
        run: |
          mkdir -p probe-evidence
          python tools/run_endpoint_fanout_probe.py \
            --value "stegverse-endpoint-fanout-probe" \
            --probe-id "ci-endpoint-fanout-001" \
            --output probe-evidence/endpoint-fanout-probe.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-fanout-probe-evidence
          path: probe-evidence/endpoint-fanout-probe.result.json
          if-no-files-found: error
