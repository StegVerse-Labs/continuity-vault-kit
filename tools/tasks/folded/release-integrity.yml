name: Release integrity

on:
  push:
    branches: [main]
    paths:
      - "tools/build_release.py"
      - "tools/verify_release.py"
      - "tools/test_release_tools.py"
      - "tools/init_vault.py"
      - "tools/test_init_vault.py"
      - "tools/test_clean_room_user_kv.py"
      - "tools/test_automation_contracts.py"
      - "tests/test_hosted_release_authority_retirement.py"
      - "tests/test_hosted_candidate_authority_retirement.py"
      - "tests/test_hosted_onboarding_control_plane_retirement.py"
      - "tests/test_production_provider_hosted_authority_retirement.py"
      - "tests/test_release_reconciliation_hosted_authority_retirement.py"
      - "tests/test_stegdb_overlay_hosted_writeback_retirement.py"
      - "tests/test_kv_format_hosted_mutation_retirement.py"
      - "tests/test_global_hosted_workflow_authority.py"
      - "tests/test_hosted_onboarding_control_plane_retirement.py"
      - "tests/test_production_provider_hosted_authority_retirement.py"
      - "tests/test_release_reconciliation_hosted_authority_retirement.py"
      - "tests/test_stegdb_overlay_hosted_writeback_retirement.py"
      - "tests/test_kv_format_hosted_mutation_retirement.py"
      - "tests/test_global_hosted_workflow_authority.py"
      - "vault_template/**"
      - "automation/**"
      - "evidence/onboarding-friction/**"
      - ".github/ISSUE_TEMPLATE/onboarding-friction.yml"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "VERSION"
  pull_request:
    paths:
      - "tools/build_release.py"
      - "tools/verify_release.py"
      - "tools/test_release_tools.py"
      - "tools/init_vault.py"
      - "tools/test_init_vault.py"
      - "tools/test_clean_room_user_kv.py"
      - "tools/test_automation_contracts.py"
      - "tests/test_hosted_release_authority_retirement.py"
      - "vault_template/**"
      - "automation/**"
      - "evidence/onboarding-friction/**"
      - ".github/ISSUE_TEMPLATE/onboarding-friction.yml"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository without credential persistence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release tooling self-test
        run: python3 tools/test_release_tools.py

      - name: Run vault initializer self-test
        run: python3 tools/test_init_vault.py

      - name: Run clean-room Packageable User KV proof
        run: python3 tools/test_clean_room_user_kv.py

      - name: Validate automation contracts
        run: python3 tools/test_automation_contracts.py

      - name: Validate hosted release authority retirement
        run: python3 -m unittest tests.test_hosted_release_authority_retirement -v

      - name: Validate hosted candidate authority retirement
        run: python3 -m unittest tests.test_hosted_candidate_authority_retirement -v

      - name: Validate hosted onboarding control-plane retirement
        run: python3 -m unittest tests.test_hosted_onboarding_control_plane_retirement -v

      - name: Validate production provider hosted authority retirement
        run: python3 -m unittest tests.test_production_provider_hosted_authority_retirement -v

      - name: Validate release reconciliation hosted authority retirement
        run: python3 -m unittest tests.test_release_reconciliation_hosted_authority_retirement -v

      - name: Validate StegDB overlay hosted writeback retirement
        run: python3 -m unittest tests.test_stegdb_overlay_hosted_writeback_retirement -v

      - name: Validate KV format hosted mutation retirement
        run: python3 -m unittest tests.test_kv_format_hosted_mutation_retirement -v

      - name: Validate repository-wide hosted workflow authority
        run: python3 -m unittest tests.test_global_hosted_workflow_authority -v

      - name: Rebuild release evidence
        run: |
          rm -rf dist
          python3 tools/build_release.py
          python3 tools/verify_release.py "dist/ContinuityVault_v$(cat VERSION).zip"

      - name: Validate manifest shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest_path = Path("dist") / f"ContinuityVault_v{version}.zip.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          required = {"schema_version", "artifact", "version", "created_utc", "sha256", "contents_root", "file_count", "files"}
          missing = sorted(required - manifest.keys())
          if missing:
              raise SystemExit(f"manifest missing fields: {missing}")
          if manifest["file_count"] != len(manifest["files"]):
              raise SystemExit("manifest file_count does not match files inventory")
          if not manifest["files"]:
              raise SystemExit("manifest files inventory is empty")
          print(f"manifest validated: {manifest['file_count']} files")
          PY

      - name: Create non-authorizing release-integrity observation
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          zip_name = f"ContinuityVault_v{version}.zip"
          manifest = json.loads((Path("dist") / f"{zip_name}.manifest.json").read_text(encoding="utf-8"))
          checksum = (Path("dist") / f"{zip_name}.sha256").read_text(encoding="utf-8").split()[0]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = changelog.split("## [Unreleased]", 1)[1].split("\n---", 1)[0]
          normalized = " ".join(section.split()).lower()
          release_required = normalized not in {"", "_no unreleased changes._", "no unreleased changes."}
          out = Path("reports/release_integrity")
          out.mkdir(parents=True, exist_ok=True)
          receipt = {
              "schema": "stegverse.kv.release-integrity-hosted-observation/v1",
              "result": "PASS",
              "repository": os.environ["REPOSITORY"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_attempt": os.environ["RUN_ATTEMPT"],
              "version": version,
              "release_required": release_required,
              "release_artifact": zip_name,
              "release_sha256": checksum,
              "manifest_schema_version": manifest["schema_version"],
              "manifest_file_count": manifest["file_count"],
              "initializer_self_test": "PASS",
              "clean_room_user_kv_test": "PASS",
              "automation_contract_test": "PASS",
              "credential_authority": "TV/TVC",
              "github_actions_role": "VALIDATION_TRANSPORT_ONLY",
              "repository_mutation_performed": False,
              "tag_mutation_performed": False,
              "release_publication_performed": False,
              "canonical_evidence_transition_performed": False,
              "authority_effect": "NONE",
              "generated_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          (out / "release-integrity-observation.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload release validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: continuity-vault-release-integrity-${{ github.sha }}
          path: |
            dist/
            reports/release_integrity/release-integrity-observation.json
          if-no-files-found: error
          retention-days: 30
